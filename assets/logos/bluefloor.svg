<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">blueFloor app icon</title>
<desc id="desc">Three covered log sources above a detection floor and one measured amber source below it.</desc>
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#003D57"/>
    <stop offset="0.48" stop-color="#007E96"/>
    <stop offset="1" stop-color="#16E3E8"/>
  </linearGradient>
  <linearGradient id="whiteFace" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#E9F0F4"/>
  </linearGradient>
  <linearGradient id="amberFace" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFC13D"/>
    <stop offset="1" stop-color="#FF8A00"/>
  </linearGradient>
  <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#001824" flood-opacity="0.28"/>
  </filter>
  <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#001824" flood-opacity="0.34"/>
  </filter>
</defs>
